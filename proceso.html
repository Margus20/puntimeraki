<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conoce el proceso creativo de las manualidades con puntillismo de Puntimeraki">
    <title>Nuestro Proceso - Puntimeraki</title>
    
    <link rel="icon" type="image/png" href="img/favicon.jpg">
    
    <!-- ✅ FUENTES DE GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playball&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- ✅ ESTILOS ESPECÍFICOS PARA TÍTULOS DE PASOS -->
    <style>
        .paso h3 {
            font-family: var(--fuente-titulo) !important;
            font-weight: 400 !important;
            text-transform: uppercase !important;
            letter-spacing: 1px !important;
        }
        .paso p {
            font-family: var(--fuente-subtitulo) !important;
            font-weight: 700 !important;
        }
    </style>
    
    <!-- CSS MODULAR -->
    <link rel="stylesheet" href="css/01-variables.css">
    <link rel="stylesheet" href="css/02-base.css">
    <link rel="stylesheet" href="css/03-header.css">
    <link rel="stylesheet" href="css/11-menu.css">
    <link rel="stylesheet" href="css/06-proceso.css">
    <link rel="stylesheet" href="css/09-footer.css">
    <link rel="stylesheet" href="css/10-animaciones.css">
</head>
<body>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL HEADER -->
    <div id="header-container"></div>
    
    <main>
        <!-- SECCIÓN PROCESO -->
        <section id="proceso" class="proceso">
            <h2 class="section-title">Nuestro Proceso Creativo</h2>
            <p class="section-subtitle">Cada pieza es un viaje de paciencia y amor.</p>
            
            <div class="proceso-steps">
                <!-- ✅ Paso 1: DISEÑAMOS -->
                <div class="paso">
                    <div class="mini-galeria" data-etapa="disenamos">
                        <img src="img/procesos/diseno/foto1.jpg" alt="Diseñamos el patrón" class="miniatura" onerror="this.src='img/logo_navidad.png'">
                        <div class="overlay-galeria">
                            <span class="icono-ver">🔍</span>
                            <span class="texto-ver">Ver fotos</span>
                        </div>
                    </div>
                    <h3>Diseñamos</h3>
                    <p>Cada patrón con dedicación</p>
                </div>
                
                <!-- ✅ Paso 2: PREPARAMOS -->
                <div class="paso">
                    <div class="mini-galeria" data-etapa="preparamos">
                        <img src="img/procesos/preparacion/foto1.jpg" alt="Preparamos la base" class="miniatura" onerror="this.src='img/logo_navidad.png'">
                        <div class="overlay-galeria">
                            <span class="icono-ver">🔍</span>
                            <span class="texto-ver">Ver fotos</span>
                        </div>
                    </div>
                    <h3>Preparamos</h3>
                    <p>La base perfecta para el arte</p>
                </div>
                
                <!-- ✅ Paso 3: PINTAMOS -->
                <div class="paso">
                    <div class="mini-galeria" data-etapa="pintamos">
                        <img src="img/procesos/pintura/foto1.jpg" alt="Pintamos punto a punto" class="miniatura" onerror="this.src='img/logo_navidad.png'">
                        <div class="overlay-galeria">
                            <span class="icono-ver">🔍</span>
                            <span class="texto-ver">Ver fotos</span>
                        </div>
                    </div>
                    <h3>Pintamos</h3>
                    <p>Punto a punto con amor</p>
                </div>
                
                <!-- ✅ Paso 4: FINALIZAMOS (IMAGEN ACTUALIZADA A PORTAVELAS) -->
                <div class="paso">
                    <div class="mini-galeria" data-etapa="finalizamos">
                        <img src="img/portavelas/foto1_1.jpg" alt="Finalizamos con detalles" class="miniatura" onerror="this.src='img/logo_navidad.png'">
                        <div class="overlay-galeria">
                            <span class="icono-ver">🔍</span>
                            <span class="texto-ver">Ver fotos</span>
                        </div>
                    </div>
                    <h3>Finalizamos</h3>
                    <p>Cada detalle cuenta</p>
                </div>
            </div>
        </section>
    </main>
    
    <!-- ✅ MODAL LIGHTBOX PARA GALERÍAS -->
    <div id="lightbox-modal" class="lightbox-modal">
        <div class="lightbox-contenido">
            <button class="lightbox-cerrar" aria-label="Cerrar galería">&times;</button>
            <button class="lightbox-anterior" aria-label="Foto anterior">&#10094;</button>
            <button class="lightbox-siguiente" aria-label="Foto siguiente">&#10095;</button>
            <img src="" alt="Foto ampliada" class="lightbox-imagen">
            <div class="lightbox-contador"></div>
        </div>
    </div>
    
    <!-- ✅ AQUÍ SE INYECTARÁ EL FOOTER -->
    <div id="footer-container"></div>

    <!-- ✅ SCRIPT PRINCIPAL -->
    <script type="module" src="js/app.js"></script>
    <!-- ✅ SCRIPT DEL LIGHTBOX -->
    <script type="module" src="js/features/lightbox-proceso.js"></script>
    
</body>
</html>
